# https://taskfile.dev
# [estudo] Task é um "task runner": guarda comandos longos com nomes curtos.
# O Go não precisa dele (go build/go test bastam), mas centraliza comandos de
# infra/lint/migrations que o "go" sozinho não cobre. Rode "task --list" para ver tudo.
version: "3"

# [estudo] O Task lê o .env e injeta as variáveis em todas as tasks. Assim o código Go
# só lê variáveis de ambiente (config.Load) e não precisa de biblioteca para .env.
# Se o arquivo não existir (ex.: no CI), ele é simplesmente ignorado.
dotenv: [".env"]

vars:
  BIN_DIR: bin
  # [estudo] exeExt vira ".exe" no Windows e "" no Linux, então o mesmo Taskfile
  # funciona na sua máquina e no CI.
  API_BIN: "{{.BIN_DIR}}/api{{exeExt}}"

tasks:
  build:
    desc: Compile the API binary into bin/
    cmds:
      - go build -o {{.API_BIN}} ./cmd/api
    # [estudo] sources/generates: o Task só recompila se algum .go mudou.
    sources:
      - "**/*.go"
      - go.mod
    generates:
      - "{{.API_BIN}}"

  run:
    desc: Run the API with hot reload (air, configured in .air.toml)
    cmds:
      - air

  test:
    desc: Run all tests with coverage and the race detector (disable with RACE=false)
    # [estudo] -race usa cgo, por isso exige um gcc funcional e CGO_ENABLED=1.
    # Sem gcc local: "task test RACE=false". O CI sempre roda com -race.
    vars:
      RACE: '{{.RACE | default "true"}}'
    env:
      CGO_ENABLED: '{{if eq .RACE "false"}}0{{else}}1{{end}}'
    cmds:
      - go test {{if ne .RACE "false"}}-race {{end}}-cover ./...
